<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Flexbox</title>

  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body{
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAVBAR */
    .navbar{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      background: #222;
      color: white;
      padding: 20px;
    }

    .links{
      display: flex;
      gap: 15px;
    }

    .cta{
      background: orange;
      padding: 10px 20px;
      border: none;
    }

    /* CONTENIDO */
    .wrapper{
      display: flex;
      flex: 1;
    }

    .sidebar{
      flex: 1;
      background: #dcdcdc;
      padding: 20px;
    }

    .contenido{
      flex: 3;
      background: #f5f5f5;
      padding: 20px;
    }

    .panel{
      flex: 1;
      background: #cfcfcf;
      padding: 20px;
    }

    /* FOOTER */
    .footer{
      display: flex;
      background: #222;
      color: white;
    }

    .footer div{
      flex: 1;
      padding: 20px;
      text-align: center;
      border: 1px solid white;
    }

  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div>LOGO</div>

    <div class="links">
      <a href="#">Inicio</a>
      <a href="#">Servicios</a>
      <a href="#">Contacto</a>
    </div>

    <button class="cta">CTA</button>
  </nav>

  <!-- BODY -->
  <main class="wrapper">

    <aside class="sidebar">
      SIDEBAR
    </aside>

    <section class="contenido">
      CONTENIDO
    </section>

    <aside class="panel">
      PANEL
    </aside>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div>Columna 1</div>
    <div>Columna 2</div>
    <div>Columna 3</div>
  </footer>

</body>
</html>
